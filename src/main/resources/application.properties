# Application Configuration
spring.application.name=BTL_OOP

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=btl_oop_db;trustServerCertificate=true
spring.datasource.username=root1
spring.datasource.password=root1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Logging Configuration
logging.level.com.btl.oop=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration (if using JWT)
jwt.secret=mySecretKey
jwt.expiration=86400000

# Validation Configuration
spring.jackson.default-property-inclusion=NON_NULL

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method