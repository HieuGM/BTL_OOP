<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.id == null} ? 'Add New Book' : 'Edit Book'"></title>
</head>
<body>
<h1 th:text="${book.id == null} ? 'Add New Book' : 'Edit Book'"></h1>

<form th:action="${book.id == null} ? @{/admin/books} : @{/admin/books/{id}(id=${book.id})}" th:object="${book}" method="post">
    <label for="title">Title:</label>
    <input type="text" id="title" th:field="*{title}">
    <br>

    <label for="author">Author:</label>
    <input type="text" id="author" th:field="*{author}">
    <br>

    <label for="price">Price:</label>
    <input type="number" step="0.01" id="price" th:field="*{price}">
    <br>

    <label for="stock">Stock:</label>
    <input type="number" id="stock" th:field="*{stock}">
    <br>

    <button type="submit">Save</button>
</form>

<a th:href="@{/admin/books}">Back to List</a>
</body>
</html>
