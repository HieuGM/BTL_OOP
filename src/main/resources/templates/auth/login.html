<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    /* Tùy chỉnh nhỏ để căn giữa */
    body {
        background-color: #f8f9fa; /* Màu nền xám nhạt */
    }
    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">

        <h2 class="text-center fw-bold mb-4">Đăng nhập</h2>

        <p th:if="${successMessage}" th:text="${successMessage}" class="alert alert-danger"></p>
        <p th:if="${param.error}" class="alert alert-danger">
          Tên đăng nhập hoặc mật khẩu không đúng.
        </p>

        <form th:action="@{/auth/login}" method="post" th:object="${form}" autocomplete="off">

          <div class="mb-3">
            <label for="username" class="form-label">Tên đăng nhập *</label>
            <input id="username" th:field="*{username}" class="form-control" required autocomplete="off">
            <div class="text-danger small" th:errors="*{username}"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu *</label>
            <input id="password" th:field="*{password}" type="password" class="form-control" required autocomplete="off"/>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
          </div>
        </form>

        <p class="text-center mt-4">
          <a th:href="@{/auth/register}">Chưa có tài khoản? Đăng ký</a>
        </p>

      </div>
    </div>
  </div>
</div>

</body>
</html>
