<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
<h1>Book Management</h1>

<form th:action="@{/admin/books}" method="get">
    <input type="text" name="q" placeholder="Search by title" th:value="${q}">
    <button type="submit">Search</button>
</form>

<a th:href="@{/admin/books/new}">Add New Book</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books.content}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>
        <td th:text="${book.stock}"></td>
        <td>
            <a th:href="@{/admin/books/{id}/edit(id=${book.id})}">Edit</a>

            <!-- ✅ Delete bằng AJAX -->
            <button type="button"
                    th:attr="data-id=${book.id}"
                    onclick="delBook(this)">
                Delete
            </button>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${books.totalPages > 0}" th:with="currentPage=${books.number}">
        <span th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}">
            <a th:if="${i != currentPage}" th:href="@{/admin/books(page=${i}, size=${books.size}, q=${q})}" th:text="${i + 1}"></a>
            <span th:if="${i == currentPage}" th:text="${i + 1}"></span>
        </span>
</div>

<script>
    async function delBook(btn) {
        if (!confirm("Delete this book?")) return;

        const id = btn.getAttribute("data-id");

        const res = await fetch(`/api/admin/books/${id}`, {
            method: "DELETE"
        });

        if (res.ok) {
            location.reload();      // ✅ giữ nguyên URL
        } else {
            alert("Delete failed: HTTP " + res.status);
        }
    }
</script>

</body>
</html>
