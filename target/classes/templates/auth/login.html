<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Đăng nhập</title>
  <style>body{font-family:system-ui;max-width:420px;margin:48px auto}</style>
</head>
<body>
<h2>Đăng nhập</h2>
<p th:if="${msg}" th:text="${msg}" style="color:#b00020"></p>

<form th:action="@{/auth/login}" method="post" th:object="${form}">
  <!-- Nếu bật CSRF: -->
  <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

  <div>
    <label>Nickname</label>
    <input type="text" th:field="*{nickname}" required/>
  </div>
  <div>
    <label>Password</label>
    <input type="password" th:field="*{password}" required/>
  </div>
  <button type="submit">Đăng nhập</button>
</form>

<p><a th:href="@{/auth/register}">Chưa có tài khoản? Đăng ký</a></p>
</body>
</html>
